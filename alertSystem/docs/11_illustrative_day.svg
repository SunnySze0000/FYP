<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 500" role="img" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Illustrative day: event jumps and the stock's hourly move range</title>
<style>.ts{font-size:12px;fill:#52514e}.th{font-size:14px;font-weight:500;fill:#0b0b0b}</style>
<rect width="680" height="500" fill="#ffffff"/>
<rect x="289.6" y="40" width="157.1" height="400" fill="#888780" opacity="0.10"/>
<text class="ts" x="368" y="58" text-anchor="middle">US market open</text>
<text class="ts" x="60" y="32">Polymarket: chance of YES for a linked event</text>
<line x1="60" y1="150" x2="640" y2="150" stroke="#c3c2b7" stroke-width="0.5"/>
<text class="ts" x="54" y="134" text-anchor="end">40%</text>
<text class="ts" x="54" y="66" text-anchor="end">74%</text>
<polyline fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="60,130 132.5,130 156.7,94 386.3,94 410.5,62 640,62"/>
<circle cx="144.6" cy="112" r="5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<circle cx="398.4" cy="78" r="5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text class="th" x="165" y="118">A</text><text class="ts" x="180" y="118">jump at 3am, +18 pts</text>
<text class="th" x="420" y="86">C</text><text class="ts" x="435" y="86">jump at 1:30pm, +16 pts</text>
<line x1="325.9" y1="112" x2="325.9" y2="140" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/>
<text class="ts" x="318" y="108" text-anchor="end">unrelated jump</text>
<text class="ts" x="60" y="190">Stock: size of each hour's move (range of the price)</text>
<line x1="60" y1="300" x2="289.6" y2="300" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="446.7" y1="300" x2="640" y2="300" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<text class="ts" x="80" y="326">market closed, no trading</text>
<text class="ts" x="470" y="326">market closed, no trading</text>
<line x1="289.6" y1="272" x2="446.7" y2="272" stroke="#888780" stroke-width="0.8" stroke-dasharray="2 3"/>
<line x1="289.6" y1="328" x2="446.7" y2="328" stroke="#888780" stroke-width="0.8" stroke-dasharray="2 3"/>
<line x1="452" y1="272" x2="465" y2="272" stroke="#888780" stroke-width="0.8" stroke-dasharray="2 3"/>
<text class="ts" x="470" y="276">normal range</text>
<rect x="291.7" y="266" width="20" height="68" rx="4" fill="#2a78d6"/>
<rect x="315.9" y="270" width="20" height="60" rx="4" fill="#b4b2a9"/>
<rect x="340" y="260" width="20" height="80" rx="4" fill="#2a78d6" opacity="0.55"/>
<rect x="364.2" y="244" width="20" height="112" rx="4" fill="#2a78d6"/>
<rect x="388.4" y="254" width="20" height="92" rx="4" fill="#2a78d6"/>
<rect x="412.5" y="265" width="20" height="70" rx="4" fill="#2a78d6" opacity="0.7"/>
<rect x="436.6" y="263" width="9" height="74" rx="3" fill="#2a78d6" opacity="0.55"/>
<text class="ts" x="301.7" y="258" text-anchor="middle">1.2×</text>
<text class="ts" x="350" y="252" text-anchor="middle">1.4×</text>
<text class="ts" x="374.2" y="236" text-anchor="middle">2.0×</text>
<text class="ts" x="398.4" y="246" text-anchor="middle">1.6×</text>
<text class="ts" x="422.5" y="257" text-anchor="middle">1.2×</text>
<text class="th" x="301.7" y="356" text-anchor="middle">B</text>
<text class="th" x="362" y="378" text-anchor="middle">D</text>
<text class="th" x="422.5" y="356" text-anchor="middle">E</text>
<line x1="60" y1="440" x2="640" y2="440" stroke="#c3c2b7" stroke-width="0.5"/>
<text class="ts" x="60" y="458" text-anchor="middle">0:00</text>
<text class="ts" x="156.7" y="458" text-anchor="middle">4:00</text>
<text class="ts" x="289.6" y="458" text-anchor="middle">9:30</text>
<text class="ts" x="446.7" y="458" text-anchor="middle">16:00</text>
<text class="ts" x="640" y="458" text-anchor="middle">24:00 ET</text>
<rect x="60" y="476" width="10" height="10" rx="2" fill="#2a78d6"/><text class="ts" x="76" y="485">linked event and the hours it affects</text>
<rect x="300" y="476" width="10" height="10" rx="2" fill="#b4b2a9"/><text class="ts" x="316" y="485">normal hour</text>
<rect x="410" y="476" width="10" height="10" rx="2" fill="#eb6834"/><text class="ts" x="426" y="485">unrelated event jump</text>
