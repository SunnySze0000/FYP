[project]
name = "walletlens"
version = "0.1.0"
description = "Smart-money research and trading helper for Polymarket"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
walletlens = "walletlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
walletlens = ["app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
